name: Booking Calendar Motion - Safe PR QA
on:
  pull_request:
    paths:
      - "scripts/build-command-center.mjs"
      - "scripts/qa-booking-calendar-motion*.mjs"
      - "overrides/assets/booking-calendar-motion.*"
      - "overrides/portfolio.html"
      - ".github/workflows/calendar-motion-pr-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned public portal
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false
      - name: Checkout approved AI Team overlay
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 827d044f0c23e8bb85b3d7b2e5cbf133752b9128
          path: ai-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build without replacing the live app
        run: node scripts/build-command-center.mjs
      - name: Existing Command Center QA
        run: node scripts/qa-command-center.mjs
      - name: Booking Calendar owner/buyer isolation and syntax
        run: node scripts/qa-booking-calendar-motion.mjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Week/month synthetic browser QA
        run: node scripts/qa-booking-calendar-motion-browser.mjs