name: Review owner Form Builder cloud QA

on:
  pull_request:
    paths:
      - 'scripts/qa-form-support-browser.mjs'
      - 'scripts/qa-paid-intake-media-browser.mjs'
      - 'overrides/published-intake.html'
      - '.github/workflows/owner-form-cloud-pr-qa.yml'
      - 'overrides/form-builder.html'
      - 'overrides/support-tickets.html'
      - 'scripts/build-command-center.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-form-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Command Center
        uses: actions/checkout@v4
      - name: Checkout pinned approved portal source
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false
      - name: Checkout approved AI Team overlay
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 827d044f0c23e8bb85b3d7b2e5cbf133752b9128
          path: ai-upstream
          persist-credentials: false
      - name: Checkout reviewed owner sales tools
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 7f5584ae5187b294c448a4bfff368bd735765492
          path: growth-upstream
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production-equivalent private portal without deploying
        run: |
          node scripts/build-command-center.mjs
          node scripts/build-sales-tools.mjs
          node scripts/qa-sales-tools-overlay.mjs
          node scripts/apply-legal-footers.mjs
          node scripts/apply-navigation-resume.mjs
      - name: Verify private routes and tenant isolation
        run: node scripts/qa-command-center.mjs
      - name: Check browser script syntax
        run: |
          node --check scripts/qa-form-support-browser.mjs
          node --check scripts/qa-paid-intake-media-browser.mjs
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify owner publish snapshots and buyer ticket isolation
        run: |
          node scripts/qa-form-support-browser.mjs
          node scripts/qa-paid-intake-media-browser.mjs
