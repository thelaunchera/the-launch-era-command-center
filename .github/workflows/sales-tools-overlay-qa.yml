name: Owner sales tools isolated portal QA
on:
  pull_request:
    paths: ['scripts/build-sales-tools.mjs','scripts/qa-sales-tools-overlay.mjs','.github/workflows/deploy-command-center.yml','.github/workflows/sales-tools-overlay-qa.yml']
permissions:
  contents: read
jobs:
  pinned-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 827d044f0c23e8bb85b3d7b2e5cbf133752b9128
          path: ai-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: fa22728e9ed734178830485d4120217a27681c9d
          path: growth-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node scripts/build-command-center.mjs
          node scripts/build-sales-tools.mjs
          node scripts/qa-sales-tools-overlay.mjs
          node scripts/qa-command-center.mjs
          node scripts/qa-booking-calendar-motion.mjs
      - run: |
          npm install --prefix /tmp/tle-growth-browser --no-audit --no-fund playwright@1.58.2
          node /tmp/tle-growth-browser/node_modules/playwright/cli.js install --with-deps chromium webkit
          mkdir -p .qa-public
          ln -s ../.site .qa-public/command-center
      - run: node growth-upstream/scripts/qa-owner-growth-browser.mjs
        env:
          TLE_PLAYWRIGHT_MODULE: /tmp/tle-growth-browser/node_modules/playwright/index.mjs
          TLE_GROWTH_PUBLIC_ROOT: .qa-public
