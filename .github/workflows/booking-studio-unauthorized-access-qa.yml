name: Booking Studio Unauthorized Access QA
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/booking-studio-unauthorized-access-qa.yml

permissions:
  contents: read

jobs:
  reject-unauthorized:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject anonymous and invalid-token requests without changing data
        shell: bash
        run: |
          set -euo pipefail
          API="https://afyiltvdfqnuyzcqsnoh.supabase.co/functions/v1/tle-booking-studio-staging-qa"
          check_denied() {
            local label="$1"
            shift
            local status
            status=$(curl --silent --show-error --max-time 20 -o /tmp/booking-studio-denied-response -w '%{http_code}' "$@" "$API")
            echo "$label: HTTP $status"
            if [[ "$status" != "401" && "$status" != "403" ]]; then
              echo "::error::$label unexpectedly returned HTTP $status"
              exit 1
            fi
          }
          check_denied "Anonymous list" -X POST -H 'Content-Type: application/json' --data '{"action":"list"}'
          check_denied "Invalid bearer list" -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-not-a-jwt' --data '{"action":"list"}'
          check_denied "Anonymous synthetic submit" -X POST -H 'Content-Type: application/json' --data '{"action":"submit","service_name":"Synthetic QA","service_area":"Miami","frequency":"one_time","addons":[],"consent_to_contact":true}'
          PROD="https://bowacxhmjvrqixtwaikv.supabase.co/functions/v1/tle-booking-studio-owner"
          check_prod_denied() {
            local label="$1"
            shift
            local status
            status=$(curl --silent --show-error --max-time 20 -o /tmp/booking-studio-owner-denied-response -w '%{http_code}' "$@" "$PROD")
            echo "$label: HTTP $status"
            if [[ "$status" != "401" && "$status" != "403" ]]; then
              echo "::error::$label unexpectedly returned HTTP $status"
              exit 1
            fi
          }
          check_prod_denied "Production owner API anonymous list" -X POST -H 'Content-Type: application/json' --data '{"action":"list"}'
          check_prod_denied "Production owner API invalid bearer list" -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-not-a-jwt' --data '{"action":"list"}'
          check_prod_denied "Anonymous owner start blocked" -X POST -H 'Content-Type: application/json' --data '{"action":"start","account_id":"00000000-0000-4000-8000-000000000000","owner_start_approved":true}'
          check_prod_denied "Anonymous owner approval blocked" -X POST -H 'Content-Type: application/json' --data '{"action":"review","job_id":"00000000-0000-4000-8000-000000000000","decision":"approve","owner_confirmed":true}'
          check_prod_denied "Invalid bearer change request blocked" -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-not-a-jwt' --data '{"action":"review","job_id":"00000000-0000-4000-8000-000000000000","decision":"request_changes","notes":"Synthetic negative security test"}'
          echo 'PASS: staging and production owner APIs reject anonymous and invalid-token reads, starts, approvals and revisions; no authorized writes performed.'
