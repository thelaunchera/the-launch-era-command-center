name: Deploy isolated Command Center to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: command-center-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dedicated Command Center deployment
        uses: actions/checkout@v4

      - name: Checkout approved public Command Center source (pinned)
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare isolated Pages artifact
        run: node scripts/build-command-center.mjs

      - name: Verify private routes, assets and separate domain
        run: node scripts/qa-command-center.mjs

      - name: Verify native calendar adapter and portfolio boundaries
        run: node scripts/qa-booking-calendar-motion.mjs

      - name: Verify compact Jessy alert on phone, tablet and desktop
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/qa-form-support-browser.mjs
          node scripts/qa-idea-vault-browser.mjs
          node scripts/qa-ai-team-easy-check-browser.mjs
          node scripts/qa-jessy-compact-browser.mjs
          node scripts/qa-cb-depot-mobile-edge-browser.mjs
          node scripts/qa-booking-studio-functional-browser.mjs
          node scripts/qa-booking-studio-followup-rules.mjs
          node scripts/qa-booking-studio-email-browser.mjs
          node scripts/qa-support-form-browser.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the isolated private portal files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dedicated Command Center
        id: deployment
        uses: actions/deploy-pages@v4
