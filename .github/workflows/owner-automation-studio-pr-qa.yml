name: Private Automations Studio PR QA
on:
  pull_request:
    branches: [main]
    paths:
      - "overrides/owner-dashboard.html"
      - "overrides/assets/owner-automation-studio.js"
      - "overrides/assets/owner-automation-studio.css"
      - "scripts/build-command-center.mjs"
      - "scripts/qa-owner-automation-studio.mjs"
      - "scripts/qa-owner-automation-mobile-browser.mjs"
      - ".github/workflows/owner-automation-studio-pr-qa.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false
      - name: Checkout approved AI Team overlay
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 827d044f0c23e8bb85b3d7b2e5cbf133752b9128
          path: ai-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-command-center.mjs
      - run: node scripts/qa-owner-automation-studio.mjs
      - run: node scripts/qa-command-center.mjs
      - name: Check iPhone, tablet, desktop layout with the actual portal CSS
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/qa-owner-automation-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-automation-mobile-qa
          path: test-results/automation-mobile/
          if-no-files-found: ignore
          retention-days: 7
