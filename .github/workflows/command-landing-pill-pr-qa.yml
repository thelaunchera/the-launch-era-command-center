name: Review Command Center floating header
on:
  push:
    branches: [feature/command-landing-floating-pill-20261016]
    paths:
      - "overrides/assets/command-landing-pill.*"
      - "scripts/build-command-center.mjs"
      - "scripts/qa-command-landing-pill*.mjs"
      - ".github/workflows/command-landing-pill-pr-qa.yml"
  pull_request:
    paths:
      - "overrides/assets/command-landing-pill.*"
      - "scripts/build-command-center.mjs"
      - "scripts/qa-command-landing-pill*.mjs"
      - ".github/workflows/command-landing-pill-pr-qa.yml"
permissions:
  contents: read
jobs:
  sign-in-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 44b5edc6e32ee850be1f5e6fca441dd17e0a4d4c
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile private portal from pinned source
        run: node scripts/build-command-center.mjs
      - name: Verify existing portal and sign-in-only changes
        run: |
          node scripts/qa-command-center.mjs
          node --check overrides/assets/command-landing-pill.js
          node scripts/qa-command-landing-pill.mjs
      - name: Install Chromium for synthetic device tests
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test header in phone, tablet, laptop and reduced motion
        run: node scripts/qa-command-landing-pill-browser.mjs
