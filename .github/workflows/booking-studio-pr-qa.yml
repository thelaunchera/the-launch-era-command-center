name: Booking Studio Portal PR QA
on:
  pull_request:
    paths:
      - 'overrides/booking-studio.html'
      - 'overrides/assets/booking-studio.js'
      - 'overrides/assets/booking-studio-preview.mjs'
      - 'scripts/build-command-center.mjs'
      - 'scripts/qa-command-center.mjs'
      - 'scripts/qa-booking-studio-email-browser.mjs'
      - '.github/workflows/booking-studio-pr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 40efa83acf5c4f28f0df2aef5cd3c8d88c7de651
          path: upstream
          persist-credentials: false
      - name: Checkout approved AI Team overlay
        uses: actions/checkout@v4
        with:
          repository: thelaunchera/the-launch-era-new-website-
          ref: 827d044f0c23e8bb85b3d7b2e5cbf133752b9128
          path: ai-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS syntax
        run: |
          node --check overrides/assets/booking-studio.js
          node --check overrides/assets/owner-automation-studio.js
          node --check overrides/assets/booking-studio-preview.mjs
      - name: Install synthetic browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Build isolated portal without publishing
        run: node scripts/build-command-center.mjs
      - name: Verify private Automations Studio is bundled
        run: |
          node --check .site/assets/owner-automation-studio.js
          node -e "const fs=require('fs');const html=fs.readFileSync('.site/index.html','utf8');if(!html.includes('ownerAutomationHub')||!html.includes('owner-automation-studio.js'))process.exit(1);console.log('OWNER_AUTOMATIONS_BUNDLED_OK')"
      - name: Verify isolated portal and Booking Studio
        run: |
          node scripts/qa-command-center.mjs
          node scripts/qa-booking-studio-email-browser.mjs
