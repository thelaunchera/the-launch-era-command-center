<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#FAF8F3">
<title>Support Tickets · The Launch Era</title><link rel="icon" href="./favicon-tle.svg">
<style>
:root{--accent:#498dbb;--soft:#e9f4fc;--paper:#fff;--bg:#f5f8fc;--ink:#191919;--sub:#617485;--line:#dae6ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Avenir Next",Futura,Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #498dbb;outline-offset:3px}[hidden]{display:none!important}
header{height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--line);background:white}
.logo{width:38px;height:38px;background:var(--soft);border:1px solid #b9daed;border-radius:12px;display:grid;place-items:center;color:#246389;font-weight:900;font-size:20px}
.brand{font-size:12px;font-weight:900;letter-spacing:.055em}.crumb{color:var(--sub);font-weight:600}
.headend{margin-left:auto;display:flex;align-items:center;gap:12px}.ghost{border:1px solid var(--line);background:white;color:#466980;border-radius:100px;padding:9px 14px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:#246389;font-weight:900}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100dvh - 64px);max-width:1600px;margin:auto}.tickets{min-width:0;padding:28px}.right{min-width:0;padding:24px;background:#eff5f9;border-left:1px solid var(--line)}
h1{font-size:26px;letter-spacing:-.055em;line-height:1.18;margin:0 0 9px}h2{font-size:23px;letter-spacing:-.045em;margin:0 0 8px}p{margin:0;color:var(--sub)}
.segment{position:relative;display:inline-flex;background:#e7eef4;padding:4px;border:1px solid #d5e2eb;border-radius:13px;margin:24px 0 18px;gap:2px}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;background:white;border-radius:10px;box-shadow:0 2px 8px #3154771c;transition:transform 587ms linear(0, .45 17%, .81 33%, .94 50%, 1),width 587ms;pointer-events:none}
.segment button{position:relative;z-index:1;border:0;background:none;padding:10px 17px;color:#607688;font-weight:700;white-space:nowrap}.segment button[aria-selected=true]{color:#191919}
#list{display:grid;gap:10px}.ticket{border:1px solid var(--line);border-radius:14px;background:white;box-shadow:0 2px 9px #28455c0a;padding:16px 18px;min-width:0}
.ticket-top{display:flex;align-items:start;gap:10px}.subject{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.meta{font-size:12px;color:var(--sub);margin-top:7px;overflow-wrap:anywhere}.pill{font-size:11px;padding:4px 9px;border-radius:100px;white-space:nowrap;font-weight:800;background:#e6f2fa;color:#2b709b}
.pill.resolved{background:#e5f5e9;color:#29744d}.pill.waiting_on_you{background:#fff4de;color:#996a12}
.ticket details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.ticket summary{color:#366e92;font-weight:700;cursor:pointer}.message{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px;color:#354e60;font-size:13px}
.ticket.new{animation:rise 560ms cubic-bezier(.32,.72,0,1) both}@keyframes rise{from{transform:translateY(-14px);opacity:0;max-height:0;padding-top:0;padding-bottom:0}to{transform:none;opacity:1;max-height:350px}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 35px #28455c0b}.smallintro{font-size:13px;margin-bottom:22px}
form{display:grid;gap:17px}label,.groupname{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#283e4e}
.input{background:#f5f9fc;border:1px solid #dce7ef;border-radius:11px;min-height:44px;padding:12px 13px;width:100%;color:var(--ink);transition:box-shadow .18s,border-color .18s}
.input:focus{outline:0;border:1.5px solid var(--accent);box-shadow:0 0 0 4px #498dbb24}
textarea.input{min-height:128px;resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices button{background:#f6f9fc;color:#4d697c;padding:9px 12px;border:1px solid #dce7ef;border-radius:100px;font-size:12px;font-weight:700;min-height:39px}
.choices button[aria-pressed=true]{background:var(--soft);border:1.5px solid var(--accent);color:#286b96;box-shadow:0 0 0 2px #498dbb10}
.priority{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:11px;background:#eef4f8;padding:4px;gap:3px}
.priority button{border:0;background:transparent;border-radius:8px;min-height:38px;font-weight:700;color:#657c8d}
.priority button[aria-pressed=true]{color:#266d98;background:white;box-shadow:0 1px 7px #39638624}
.primary{border:0;background:#438dbb;color:white;border-radius:12px;padding:14px 16px;min-height:48px;font-weight:800;width:100%;box-shadow:0 4px 12px #4085b130}
.error{border-color:#c75353!important;box-shadow:0 0 0 4px #c7535320!important}.shake{animation:shake 380ms ease}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#toast{position:fixed;bottom:22px;right:22px;z-index:10;background:#183d55;color:white;padding:14px 20px;border-radius:12px;box-shadow:0 10px 35px #17395035}
.empty{border:1px dashed #ccdce8;padding:34px;text-align:center;border-radius:14px;color:#637f91}
#gate{padding:25px;text-align:center;color:#4c6578}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 345px}.tickets{padding:20px}.right{padding:18px}.card{padding:18px}}
@media(max-width:760px){header{padding:0 15px}.headend .ghost,.avatar,.crumb{display:none}.layout{display:flex;flex-direction:column}.tickets{padding:23px 14px 10px}.right{border:0;background:transparent;padding:18px 14px 35px}.card{padding:19px}.ticket .replycount{display:none}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<header><a class="logo" href="./" aria-label="Back to Command Center">✳</a><strong class="brand" id="company">THE LAUNCH ERA</strong><span class="crumb">/ Support</span><div class="headend"><a class="ghost" href="./">← Command Center & Help articles</a><span class="avatar" id="avatar" aria-hidden="true">T</span></div></header>
<div id="gate" role="status">Checking secure access…</div>
<main class="layout" id="app" hidden>
<section class="tickets"><h1>Your tickets</h1><p>We review every request and update its status here. Replies may also arrive by email.</p>
<div class="segment" id="tabs" role="tablist" aria-label="Ticket status"><span class="thumb" id="thumb"></span>
<button id="openTab" type="button" role="tab" aria-selected="true" aria-controls="list">Open <span id="openCount">0</span></button>
<button id="resolvedTab" type="button" role="tab" aria-selected="false" aria-controls="list">Resolved <span id="resolvedCount">0</span></button></div>
<div id="list" role="tabpanel" aria-labelledby="openTab" aria-live="polite"></div></section>
<aside class="right"><div class="card"><h2>New ticket</h2><p class="smallintro">Tell us what you need help with. Your message goes to The Launch Era support.</p>
<form id="form" novalidate><div><label for="subject">Subject <span aria-hidden="true">*</span></label><input class="input" id="subject" maxlength="120" required placeholder="What do you need help with?" aria-describedby="subjectError"><span id="subjectError" style="font-size:12px;color:#bc4848" role="status"></span></div>
<div><span class="groupname" id="categoryLabel">Category</span><div class="choices" id="categories" role="group" aria-labelledby="categoryLabel">
<button type="button" aria-pressed="true" data-category="Technical issue">Technical</button><button type="button" aria-pressed="false" data-category="Booking & calendar">Bookings</button><button type="button" aria-pressed="false" data-category="Billing">Billing</button><button type="button" aria-pressed="false" data-category="Other">Other</button></div></div>
<div><span class="groupname" id="priorityLabel">Priority</span><div class="priority" id="priorities" role="group" aria-labelledby="priorityLabel">
<button type="button" aria-pressed="true" data-priority="Normal">Normal</button><button type="button" aria-pressed="false" data-priority="High">High</button><button type="button" aria-pressed="false" data-priority="Urgent">Urgent</button></div></div>
<div><label for="details">Details <span aria-hidden="true">*</span></label><textarea class="input" id="details" rows="5" maxlength="2600" minlength="10" required placeholder="Describe what happened and what you expected…" aria-describedby="detailsError"></textarea><span id="detailsError" style="font-size:12px;color:#bc4848" role="status"></span></div>
<button class="primary" id="send" type="submit">↗ Send ticket</button></form></div></aside>
</main><div id="toast" hidden role="status" aria-live="polite"></div>
<script src="./vendor/supabase-js-v2.57.0.umd.js"></script><script>
(function(){
"use strict";

var meta=elt("div","meta","#"+String(x.id||"").slice(0,8).toUpperCase()+" · "+(x.page_context|| (x.request_type==="feedback"?"Feedback":"Support"))+" · "+displayTime(x.created_at));

$("categories").addEventListener("click",function(e){var b=e.target.closest("button[data-category]");if(!b)return;category=b.dataset.category;select($("categories"),"category",category)});

$("details").classList.remove("error");$("detailsError").textContent="";var send=$("send");send.disabled=true;send.textContent="Sending…";

var r=await db.from("tle_crm_support_requests").insert(p);if(r.error)throw r.error;
await refresh();latestId=items[0]&&items[0].id||"";tab="open";render();$("form").reset();category="Technical issue";priority="Normal";select($("categories"),"category",category);select($("priorities"),"priority",priority);toast("✓ Ticket received"+(latestId?" · #"+latestId.slice(0,8).toUpperCase():""));$("subject").focus()
}catch(ex){toast("Couldn't send this ticket. Your text is still here. Please retry.");}finally{send.disabled=false;send.textContent="↗ Send ticket"}});
window.addEventListener("resize",highlight);
(async function(){try{
if(!window.supabase||!window.supabase.createClient)throw Error("Authentication unavailable");

}catch(ex){err("This page needs an active client account.");}})();

</script></body></html>
